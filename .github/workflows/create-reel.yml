
name: Create AI Reel

on:
  workflow_dispatch:
    inputs:
      topic:
        description: "Enter your Reel topic"
        required: true
        default: "Discipline beats motivation"

permissions:
  contents: read

jobs:
  make-reel:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Get code
        uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install packages
        run: |
          pip install -r requirements.txt

      - name: Generate AI Reel
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          REEL_TOPIC: ${{ inputs.topic }}
          GEMINI_MODEL: gemini-2.5-flash
          TTS_VOICE: hi-IN-SwaraNeural
        run: python main.py

      - name: Save finished video
        uses: actions/upload-artifact@v4
        with:
          name: ai-reel-mp4
          path: output/
          retention-days: 7
